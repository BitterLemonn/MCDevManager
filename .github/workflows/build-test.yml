name: Build Test

# 推送到 MPR 分支时自动触发，同时支持手动触发
on:
  push:
    branches:
      - MPR
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================
  # Android — Debug APK（无需签名配置，适合快速测试）
  # ============================================================
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Switch Gradle mirror to official source
        run: sed -i 's|mirrors.aliyun.com/macports/distfiles/gradle|services.gradle.org/distributions|' gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  # ============================================================
  # Desktop — JVM 编译验证（跨平台通用）
  # ============================================================
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Switch Gradle mirror to official source
        run: sed -i 's|mirrors.aliyun.com/macports/distfiles/gradle|services.gradle.org/distributions|' gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Desktop App
        run: ./gradlew :desktopApp:compileKotlin --no-daemon

  # ============================================================
  # Windows — Portable ZIP（免安装版，无需签名）
  # ============================================================
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Switch Gradle mirror to official source
        run: (Get-Content gradle/wrapper/gradle-wrapper.properties) -replace 'mirrors\.aliyun\.com/macports/distfiles/gradle', 'services.gradle.org/distributions' | Set-Content gradle/wrapper/gradle-wrapper.properties

      - name: Build Windows Portable
        run: ./gradlew :desktopApp:packagePortable --no-daemon

      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: desktopApp/build/distributions/*.zip

  # ============================================================
  # iOS — Kotlin/Native 编译验证
  # ============================================================
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Switch Gradle mirror to official source
        run: sed -i '' 's|mirrors.aliyun.com/macports/distfiles/gradle|services.gradle.org/distributions|' gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build iOS framework
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon
