  # ============================================================
  # iOS — 未签名 IPA（用户自行通过 Sideloadly/AltStore 签名）
  # ============================================================
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # CMP 1.11.x 的 Skiko 引用了 iOS 26 的 UIUtilities 框架，需要 Xcode 26+ SDK
      # 详见: https://youtrack.jetbrains.com/issue/CMP-10179
      - name: Select Xcode (iOS 26 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Switch Gradle mirror to official source
        run: sed -i '' 's|distributionUrl=.*|distributionUrl=https://services.gradle.org/distributions/gradle-9.5.0-bin.zip|' gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build iOS framework
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon

      - name: Build unsigned app
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            -quiet

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name '*.app' | head -1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr MCDevManager-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: MCDevManager-unsigned.ipa

  # ============================================================
  # Publish — 汇总所有产物，创建 Draft Pre-release（原始格式下载）
  # ============================================================
  publish:
    needs: [android, macos, windows, linux, ios]
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: artifacts

      - name: Publish draft pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-build-${{ github.run_number }}
          name: CI Build #${{ github.run_number }}
          files: artifacts/**/*
          draft: true
          prerelease: true
