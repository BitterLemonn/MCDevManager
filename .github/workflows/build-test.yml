name: Build Test

# 推送到 MPR 分支时自动触发，同时支持手动触发
on:
  push:
    branches:
      - MPR
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================
  # Android — Debug APK（无需签名配置，适合快速测试）
  # ============================================================
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Switch Gradle mirror to official source
        run: sed -i 's|distributionUrl=.*|distributionUrl=https://services.gradle.org/distributions/gradle-9.5.0-bin.zip|' gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  # ============================================================
  # Desktop — JVM 编译验证（跨平台通用）
  # ============================================================
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Switch Gradle mirror to official source
        run: sed -i 's|distributionUrl=.*|distributionUrl=https://services.gradle.org/distributions/gradle-9.5.0-bin.zip|' gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Desktop App
        run: ./gradlew :desktopApp:compileKotlin --no-daemon

  # ============================================================
  # macOS — App 构建验证
  # ============================================================
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Switch Gradle mirror to official source
        run: sed -i '' 's|distributionUrl=.*|distributionUrl=https://services.gradle.org/distributions/gradle-9.5.0-bin.zip|' gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build macOS App
        run: ./gradlew :desktopApp:createDistributable --no-daemon 2>&1 || true

      - name: Print jpackage error logs
        if: always()
        run: |
          echo "=== jpackage error log ==="
          find desktopApp/build/compose/logs -name "*-err.txt" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || echo "No error log found"
          echo ""
          echo "=== jpackage output log ==="
          find desktopApp/build/compose/logs -name "*-out.txt" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || echo "No output log found"
          echo ""
          echo "=== jpackage args ==="
          find desktopApp/build/compose/tmp -name "*.args.txt" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || echo "No args file found"

      - name: Verify build succeeded
        run: |
          if [ ! -d "desktopApp/build/compose/binaries/main/app" ]; then
            echo "::error::createDistributable did not produce app bundle"
            exit 1
          fi
          echo "App bundle created successfully"

      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: macos-app
          path: desktopApp/build/compose/binaries/main/app/**

  # ============================================================
  # Windows — Portable ZIP（免安装版，无需签名）
  # ============================================================
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Switch Gradle mirror to official source
        run: (Get-Content gradle/wrapper/gradle-wrapper.properties) -replace 'distributionUrl=.*', 'distributionUrl=https://services.gradle.org/distributions/gradle-9.5.0-bin.zip' | Set-Content gradle/wrapper/gradle-wrapper.properties

      - name: Build Windows Portable
        run: ./gradlew :desktopApp:packagePortable --no-daemon

      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: desktopApp/build/distributions/*.zip

  # ============================================================
  # iOS — Kotlin/Native 编译验证
  # ============================================================
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Switch Gradle mirror to official source
        run: sed -i '' 's|distributionUrl=.*|distributionUrl=https://services.gradle.org/distributions/gradle-9.5.0-bin.zip|' gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build iOS framework
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon
