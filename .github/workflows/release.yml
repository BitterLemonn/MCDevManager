name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: ''

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================
  # Android — Release APK
  # ============================================================
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"

      - name: Switch Gradle mirror to official source
        run: sed -i 's|distributionUrl=.*|distributionUrl=https://services.gradle.org/distributions/gradle-9.5.0-bin.zip|' gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename & upload APK
        run: |
          SRC=$(find androidApp/build/outputs/apk/release -name '*.apk' | head -1)
          DST="MCDevManagerMP-V${{ steps.vars.outputs.version }}-android.apk"
          mv "$SRC" "$DST"
          echo "artifact=$DST" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: MCDevManagerMP-V${{ steps.vars.outputs.version }}-android.apk

  # ============================================================
  # macOS — DMG
  # ============================================================
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"

      - name: Switch Gradle mirror to official source
        run: sed -i '' 's|distributionUrl=.*|distributionUrl=https://services.gradle.org/distributions/gradle-9.5.0-bin.zip|' gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build macOS DMG
        run: ./gradlew :desktopApp:packageDmg --no-daemon

      - name: Rename & upload DMG
        run: |
          SRC=$(find desktopApp/build/compose/binaries/main/dmg -name '*.dmg' | head -1)
          DST="MCDevManagerMP-V${{ steps.vars.outputs.version }}-macos.dmg"
          mv "$SRC" "$DST"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: MCDevManagerMP-V${{ steps.vars.outputs.version }}-macos.dmg

  # ============================================================
  # Windows — MSI 安装版 + Portable ZIP 便携版
  # ============================================================
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        id: vars
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}" -replace '^v',''
          }
          $v = $v -replace '^v',''
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Switch Gradle mirror to official source
        run: (Get-Content gradle/wrapper/gradle-wrapper.properties) -replace 'distributionUrl=.*', 'distributionUrl=https://services.gradle.org/distributions/gradle-9.5.0-bin.zip' | Set-Content gradle/wrapper/gradle-wrapper.properties

      - name: Build Windows artifacts
        run: ./gradlew :desktopApp:packageInstaller :desktopApp:packagePortable --no-daemon

      - name: Rename artifacts
        shell: pwsh
        run: |
          $v = "${{ steps.vars.outputs.version }}"
          $msi = Get-ChildItem desktopApp/build/release/msi/*.msi -ErrorAction Stop | Select-Object -First 1
          $zip = Get-ChildItem desktopApp/build/release/portable/*.zip -ErrorAction Stop | Select-Object -First 1
          Write-Host "MSI source: $($msi.FullName)"
          Write-Host "ZIP source: $($zip.FullName)"
          Move-Item $msi.FullName "MCDevManagerMP-V$v-windows-x64.msi"
          Move-Item $zip.FullName "MCDevManagerMP-V$v-windows-x64-portable.zip"
          Write-Host "MSI dest: $(Resolve-Path "MCDevManagerMP-V$v-windows-x64.msi")"
          Write-Host "ZIP dest: $(Resolve-Path "MCDevManagerMP-V$v-windows-x64-portable.zip")"

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: MCDevManagerMP-V${{ steps.vars.outputs.version }}-windows-x64.msi

      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: MCDevManagerMP-V${{ steps.vars.outputs.version }}-windows-x64-portable.zip

  # ============================================================
  # Linux — DEB 包
  # ============================================================
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"

      - name: Switch Gradle mirror to official source
        run: sed -i 's|distributionUrl=.*|distributionUrl=https://services.gradle.org/distributions/gradle-9.5.0-bin.zip|' gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Linux DEB
        run: ./gradlew :desktopApp:packageDeb --no-daemon

      - name: Rename & upload DEB
        run: |
          SRC=$(find desktopApp/build/compose/binaries/main/deb -name '*.deb' | head -1)
          DST="MCDevManagerMP-V${{ steps.vars.outputs.version }}-linux-x64.deb"
          mv "$SRC" "$DST"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: MCDevManagerMP-V${{ steps.vars.outputs.version }}-linux-x64.deb

  # ============================================================
  # MCP Server — 跨平台 stdio ZIP
  # ============================================================
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"

      - name: Switch Gradle mirror to official source
        run: sed -i 's|distributionUrl=.*|distributionUrl=https://services.gradle.org/distributions/gradle-9.5.0-bin.zip|' gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test & package MCP Server
        run: ./gradlew :mcpServer:test :mcpServer:distZip --no-daemon

      - name: Rename MCP ZIP
        run: |
          SRC=$(find mcpServer/build/distributions -name '*.zip' | head -1)
          DST="MCDevManagerMP-V${{ steps.vars.outputs.version }}-mcp.zip"
          mv "$SRC" "$DST"

      - name: Upload MCP ZIP
        uses: actions/upload-artifact@v4
        with:
          name: mcp-zip
          path: MCDevManagerMP-V${{ steps.vars.outputs.version }}-mcp.zip

  # ============================================================
  # iOS — 未签名 IPA（用户自行通过 Sideloadly/AltStore 签名）
  # ============================================================
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # CMP 1.11.x 的 Skiko 引用了 iOS 26 的 UIUtilities 框架，需要 Xcode 26+ SDK
      # 详见: https://youtrack.jetbrains.com/issue/CMP-10179
      - name: Select Xcode (iOS 26 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Determine version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"

      - name: Switch Gradle mirror to official source
        run: sed -i '' 's|distributionUrl=.*|distributionUrl=https://services.gradle.org/distributions/gradle-9.5.0-bin.zip|' gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build iOS framework
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon

      - name: Build unsigned app
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            -quiet

      - name: Package & rename IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name '*.app' | head -1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr "MCDevManagerMP-V${{ steps.vars.outputs.version }}-ios-arm64.ipa" Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: MCDevManagerMP-V${{ steps.vars.outputs.version }}-ios-arm64.ipa

  # ============================================================
  # Release — 汇总所有产物并创建 GitHub Release
  # ============================================================
  release:
    needs: [ android, macos, windows, linux, ios, mcp ]
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: artifacts

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF#refs/tags/v}"
          fi
          echo "tag=v${V#v}" >> "$GITHUB_OUTPUT"

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MCDevManagerMP ${{ steps.version.outputs.tag }}
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
